<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-title" content="Recipes">
<title>Recipes</title>
<style>
:root {
  --bg: #fbfaf7;
  --text: #1f1d1a;
  --muted: #6b665e;
  --rule: #e4e0d8;
  --accent: #9a4a1c;
  --done: #a8a399;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 19px;
  line-height: 1.55;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 16px 20px 64px;
}
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  padding: 4px 0 12px;
  border-bottom: 1px solid var(--rule);
}
a { color: var(--accent); }
nav a { text-decoration: none; padding: 8px 0; }
h1 { font-size: 1.7rem; line-height: 1.2; margin: 24px 0 12px; }
h2 {
  font-size: 1.15rem;
  margin: 32px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--rule);
}
h3 { font-size: 1.05rem; margin: 24px 0 8px; }
ul, ol { padding-left: 1.4em; margin: 8px 0; }
li { margin: 6px 0; }
ol > li { margin: 14px 0; }
ul > li { cursor: pointer; -webkit-tap-highlight-color: transparent; }
li.done { color: var(--done); text-decoration: line-through; }
strong { font-weight: 650; }
table { border-collapse: collapse; width: 100%; font-size: 17px; margin: 12px 0; }
th, td { border-bottom: 1px solid var(--rule); padding: 6px 8px; text-align: left; }
.index { list-style: none; padding: 0; margin: 16px 0; }
.index li { margin: 0; border-bottom: 1px solid var(--rule); }
.index a { display: block; padding: 14px 0; text-decoration: none; color: var(--text); font-size: 1.1rem; }
.wake {
  font: inherit;
  font-size: 15px;
  color: var(--accent);
  background: none;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 6px 12px;
}
.wake[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
</style>
</head>
<body>
<main>
<nav><a href="/">pwills.com</a></nav>
<h1>Recipes</h1>
<ul class="index">

<li><a href="liver-beef-caramelized-onions/">Liver, Beef, and Caramelized Onions with Mushrooms</a></li>
<li><a href="seafood-stew/">Seafood Stew</a></li>
<li><a href="roast-chicken/">Simple Roast Chicken</a></li>
<li><a href="chili/">Smoked Chili</a></li>
<li><a href="standards/">Standards</a></li>
<li><a href="vegan-pesto/">Vegan Pesto</a></li>
</ul>
</main>

</body>
</html>
